[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeseeks"
version = "0.1.0"
description = "Autonomous agentic programming harness — I'm Mr. Meeseeks, look at me!"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "tiktoken>=0.5",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
meeseeks = "meeseeks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["meeseeks"]
